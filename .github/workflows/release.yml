name: Signed Binary Release

on:
  push:
    tags:
      - 'v*'
      - 'RELEASE.*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Build & Sign Binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.24.x

      - name: Build Binaries (Multi-Platform)
        run: |
          mkdir -p dist
          PLATFORMS=("linux/amd64" "linux/arm64" "darwin/amd64" "darwin/arm64" "windows/amd64")
          for p in "${PLATFORMS[@]}"; do
            os="${p%/*}"
            arch="${p#*/}"
            bin_name="mc-${os}-${arch}"
            if [ "$os" == "windows" ]; then
              bin_name="mc-${os}-${arch}.exe"
            fi
            echo "Building for ${os}/${arch}..."
            GOOS="${os}" GOARCH="${arch}" CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o "dist/${bin_name}" .
          done

      - name: Generate Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          if command -v b3sum >/dev/null 2>&1; then
            b3sum * > BLAKE3SUMS
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/*
          draft: false
          prerelease: false
